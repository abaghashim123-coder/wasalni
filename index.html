<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وصلني - تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="login.html" class="logo">🚖 وصلني</a>
            <ul class="nav-links">
                <li><a href="login.html" class="active">تسجيل الدخول</a></li>
                <li><a href="cars.html">السيارات والأسعار</a></li>
                <li><a href="map.html">الخريطة واللوكيشن</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div style="max-width: 450px; margin: 3rem auto;" class="card">
            <h2 class="page-title">تسجيل الدخول</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="phone">رقم الهاتف أو البريد الإلكتروني</label>
                    <input type="text" id="phone" placeholder="أدخل رقم الهاتف أو البريد" required>
                </div>
                
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="font-weight: normal; cursor: pointer;">
                        <input type="checkbox"> تذكرني
                    </label>
                    <a href="#" style="color: var(--primary-color); font-size: 0.9rem; text-decoration: none;">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn">دخول</button>
            </form>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - تطبيق وصلني</p>
    </footer>

</body>
</html>
