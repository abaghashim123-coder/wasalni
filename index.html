<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - تطبيق وصلني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <header style="margin-bottom: 20px;">
            <h2><a href="index.html">وصلني 🚗</a></h2>
            <nav>
                <a href="login.html">دخول</a>
                <a href="about.html">عن الموقع</a>
                <a href="map.html">الخريطة</a>
                <a href="contact.html">تواصل معنا</a>
            </nav>
        </header>
        
        <main>
            <h3>تسجيل الدخول إلى حسابك</h3>
            <form action="#" method="POST">
                <div style="margin-bottom: 15px;">
                    <label for="email">البريد الإلكتروني أو اسم المستخدم:</label>
                    <input type="text" id="email" name="email" required placeholder="ادخل البريد الإلكتروني">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label for="password">كلمة المرور:</label>
                    <input type="password" id="password" name="password" required placeholder="ادخل كلمة المرور">
                </div>
                
                <button type="submit">دخول</button>
            </form>
        </main>
        
        <footer>
            <p>جميع الحقوق محفوظة لموقع وصلني &copy; 2026</p>
        </footer>
    </div>
</body>
</html>
