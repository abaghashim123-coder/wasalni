    <main>
        <h3>تواصل معنا</h3>
        <p>يسعدنا تواصلكم معنا على مدار الساعة لخدمتكم والإجابة عن أي استفسارات تخص رحلاتكم.</p>

        <form>
            <div>
                <label for="name">الاسم:</label><br>
                <input type="text" id="name" name="name" required placeholder="أدخل اسمك الكريم">
            </div>
            <br>
            <div>
                <label for="msg">الرسالة:</label><br>
                <textarea id="msg" name="msg" rows="4" required placeholder="اكتب رسالتك هنا..."></textarea>
            </div>
            <br>
            <div>
                <button type="submit">إرسال الرسالة</button>
            </div>
        </form>
